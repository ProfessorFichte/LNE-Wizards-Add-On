# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Mod properties
mod_version = 1.2.1
maven_group = com.lne_wizards
archives_name = lne_wizards

# Minecraft properties
minecraft_version = 1.20.1
yarn_mappings = 1.20.1+build.1

# Loader
enabled_platforms = fabric,forge
fabric_loader_version = 0.19.5
# Oldest loader this mod actually runs on. NOT the build version above -
# driving the manifest from that would over-declare the requirement.
# 0.14.21 is the 1.20.1-era loader and the value every sibling 1.20.1 fork declares. The `1.21.1`
# branch said 0.16.5, which is a 1.21-era number that came along with the file; nothing here needs it
# (the only Fabric Loader API this mod touches is `FabricLoader#isModLoaded` / `#getModContainer`).
fabric_loader_compat_version=0.14.21
forge_version = 1.20.1-47.4.22

# Dependencies
fabric_api_version = 0.92.12+1.20.1
cloth_config_version=11.1.106
# PlayerAnimator 1.x (mod id `player-animator` on Fabric, `playeranimator` on Forge)
player_anim_version=1.0.2+1.19.4
# Modrinth maven coordinates: maven.modrinth:tiny-config:<version>-<platform>
tiny_config_version=3.1.0+1.20.1
# Modrinth maven coordinates: maven.modrinth:spell-power:<version>-<platform>
spell_power_version=1.6.0+1.20.1
# Modrinth maven coordinates: maven.modrinth:spell-engine:<version>-<platform>
spell_engine_version=1.10.5+1.20.1
# mavenLocal coordinates: net.more_rpg_classes:more_rpg_library-<platform>:<version>
# The one ecosystem library NOT on Modrinth for 1.20.1 (Fichte owns that project and its newest 1.20.1
# build is the ancient Fabric-only 1.2.22-1.20.1), so it keeps resolving from mavenLocal. Becomes
# `maven.modrinth:more-rpg-library:2.7.2+1.20.1-<platform>` the day Fichte publishes the port.
more_rpg_library_version=2.7.2+1.20.1

# Optional / dev-runtime pins
# Loot & Explore is Fabric-only on BOTH version lines. Compile-only in `common`,
# real dependency on Fabric, absent on Forge - see `compat/LootNExplore`.
# mavenLocal coordinates: com.example:Loot-N-Explore:<version> (no platform suffix)
loot_n_explore_version=1.0.22+1.20.1
# mavenLocal coordinates: com.elemental_wizards:elemental_wizards_rpg-<platform>:<version>
# No Java references it - dev runtime only, but REQUIRED for reproducible datagen
# (the three EW-gated staves and the air/earth/water evokers are only registered when it is loaded).
# .002 carries its own Forge RegisterEvent fix; .001 cannot boot on Forge below 47.4.0.
elemental_wizards_version=3.1.1+1.20.1
# Modrinth maven coordinates: maven.modrinth:wizards:<version>-<platform> - dev runtime only
# (Elemental Wizards requires it). The 3.1.2 release descends from the dev builds that carry the Forge
# RegisterEvent fix (3.1.2.009 / .010), so it boots on Forge below 47.4.0.
wizards_version = 3.1.2+1.20.1
# Modrinth maven coordinates: maven.modrinth:armor-model-api:<version>-<platform> - dev runtime only
# (Elemental Wizards requires it)
armor_model_api_version=1.0.0+1.20.1
# Modrinth maven coordinates: maven.modrinth:structure-pool-api:<version>-<platform> - dev runtime only
# (Loot & Explore / Wizards require it)
structure_pool_api_version=1.2.1+1.20.1
# Modrinth maven coordinates: maven.modrinth:runes:<version>-<platform> - dev runtime only
# (More RPG Library ships `runes:crafting` recipes that fail to parse without it)
runes_version = 1.3.2+1.20.1

# Fabric only
# Trinkets 3.7.2 is inherited transitively from SpellEngine; its nested Cardinal Components needs a dev pin.
trinkets_version=3.7.2
cardinal_components_version=5.2.0

# Forge only
curios_version=5.14.1+1.20.1
# Forge 47 does not bundle MixinExtras; SpellEngine JiJs it in production, but Loom does not load
# nested jars of classpath mods, so the dev runtime needs an explicit pin. Never 0.4.1.
mixin_extras_version=0.5.5
