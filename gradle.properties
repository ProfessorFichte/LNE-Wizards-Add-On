# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Mod properties
mod_version = 1.2.1.001
maven_group = com.lne_wizards
archives_name = lne_wizards

# Minecraft properties
minecraft_version = 1.20.1
yarn_mappings = 1.20.1+build.1

# Loader
enabled_platforms = fabric,forge
fabric_loader_version = 0.19.5
# Oldest loader this mod actually runs on. NOT the build version above -
# driving the manifest from that would over-declare the requirement.
fabric_loader_compat_version=0.16.5
forge_version = 1.20.1-47.4.22

# Dependencies
fabric_api_version = 0.92.12+1.20.1
cloth_config_version=11.1.106
# PlayerAnimator 1.x (mod id `player-animator` on Fabric, `playeranimator` on Forge)
player_anim_version=1.0.2+1.19.4
# mavenLocal coordinates: net.tiny_config:tiny_config-<platform>:<version>
tiny_config_version=3.1.0.001
# mavenLocal coordinates: net.spell_power:spell_power-<platform>:<version>
spell_power_version=1.6.0.002+1.20.1
# mavenLocal coordinates: net.spell_engine:spell_engine-<platform>:<version>
spell_engine_version=1.10.5.017+1.20.1
# mavenLocal coordinates: net.more_rpg_classes:more_rpg_library-<platform>:<version>
# .003 - .001 is client-fatal, .002 has a Forge networking bug.
more_rpg_library_version=2.7.2.003+1.20.1

# Optional / dev-runtime pins
# Loot & Explore is Fabric-only on BOTH version lines. Compile-only in `common`,
# real dependency on Fabric, absent on Forge - see `compat/LootNExplore`.
# mavenLocal coordinates: com.example:Loot-N-Explore:<version> (no platform suffix)
loot_n_explore_version=1.0.22.001+1.20.1
# mavenLocal coordinates: com.elemental_wizards:elemental_wizards_rpg-<platform>:<version>
# No Java references it - dev runtime only, but REQUIRED for reproducible datagen
# (the three EW-gated staves and the air/earth/water evokers are only registered when it is loaded).
elemental_wizards_version=3.1.1.001+1.20.1
# mavenLocal coordinates: net.rpg_series:wizards-<platform>:<version> - dev runtime only (Elemental Wizards requires it)
wizards_version = 3.1.2.007+1.20.1
# mavenLocal coordinates: net.rpg_foundation:armor_model_api-<platform>:<version> - dev runtime only (Elemental Wizards requires it)
armor_model_api_version=1.0.0.001+1.20.1
# mavenLocal coordinates: net.foundation:structure_pool_api-<platform>:<version> - dev runtime only (Loot & Explore / Wizards require it)
structure_pool_api_version=1.2.1.001+1.20.1
# mavenLocal coordinates: net.rpg_series:runes-<platform>:<version> - dev runtime only
# (More RPG Library ships `runes:crafting` recipes that fail to parse without it)
runes_version = 1.3.2.001+1.20.1

# Fabric only
# Trinkets 3.7.2 is inherited transitively from SpellEngine; its nested Cardinal Components needs a dev pin.
trinkets_version=3.7.2
cardinal_components_version=5.2.0

# Forge only
curios_version=5.14.1+1.20.1
# Forge 47 does not bundle MixinExtras; SpellEngine JiJs it in production, but Loom does not load
# nested jars of classpath mods, so the dev runtime needs an explicit pin. Never 0.4.1.
mixin_extras_version=0.5.5
